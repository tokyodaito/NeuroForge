name: ci

# NeuroForge continuous integration.
#
# NeuroForge is Linux-only (WSL2 is the supported path from a Windows host;
# see ADR-0020). CI runs the Linux build/test gate including the race
# detector. No real AI providers, coding-agent CLIs or secrets are used
# (spec rules §36.5/§36.17); everything runs offline with the fake agent.

on:
  push:
    branches: [main]
  pull_request:

  # Allow manual triggering from the Actions tab.
  workflow_dispatch:

jobs:
  linux:
    name: Linux (make check + race baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make check (fmt-check + vet + test)
        run: make check

      - name: go test -race
        run: go test -race -count=1 ./...
